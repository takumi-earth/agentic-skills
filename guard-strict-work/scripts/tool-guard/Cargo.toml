[package]
name = "strict-tool-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
url = "2.5"

[dev-dependencies]
strict-test-support = { version = "0.1.1", git = "https://github.com/earthlings-dev/strict-test-support-rs.git", branch = "main", default-features = false }

[patch.crates-io]
thiserror = { version = "2.1.0", git = "https://github.com/strict-rs/strict-thiserror.git", branch = "strict" }
thiserror-impl = { git = "https://github.com/strict-rs/strict-thiserror.git", branch = "strict" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[[bin]]
name = "strict-tool-guard"
path = "src/main.rs"
