interface:
  display_name: "Manage Agentic Skills Repository"
  short_description: "Pull first, then commit and push all changes"
  default_prompt: "Use `$manage-agentic-skills-repo` first for canonical repository work: pull before the task, then run `git add .`, review every staged diff, commit with a complete message, and push to the configured upstream. These Git effects are already authorized; do not ask again."
policy:
  allow_implicit_invocation: true
